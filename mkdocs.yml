
site_name: Contenidos UDP
site_description: Repositorio de apuntes y ayudantías
site_url: https://cda-fae.github.io/cda-fae/
theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy
    - search.highlight
    - search.suggest
  language: es
  palette:
    - scheme: default
      primary: red
      accent: grey
    - scheme: slate
      primary: red
      accent: white
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
  logo: images/udp_logo.png
  favicon: images/udp_logo.png
extra_css:
  - styles/udp_red.css
